# The whole bank on any Kubernetes cluster (validated on kind in CI).
# Two things live outside the repo and are created first (see deploy/k8s/README.md):
#   - Secret ledgerline-secrets: postgres-password, rabbitmq-password, keycloak-admin-password
#   - ConfigMap keycloak-realm: from deploy/keycloak/ledgerline-realm.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ledgerline
labels:
  - pairs:
      app.kubernetes.io/part-of: ledgerline
    includeSelectors: false
resources:
  - namespace.yaml
  - infrastructure/postgres.yaml
  - infrastructure/rabbitmq.yaml
  - infrastructure/keycloak.yaml
  - apps/ledger.yaml
  - apps/payments.yaml
  - apps/fraud.yaml
  - apps/gateway.yaml
  - network-policies.yaml
images:
  - name: ledgerline-ledger
    newTag: local
  - name: ledgerline-payments
    newTag: local
  - name: ledgerline-fraud
    newTag: local
  - name: ledgerline-gateway
    newTag: local
