apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  # Database per service: no service can read another one's tables.
  01-databases.sql: |
    CREATE DATABASE ledgerdb;
    CREATE DATABASE paymentsdb;
    CREATE DATABASE frauddb;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:18
          # Budget: 5 service pods × a pool of 20 (set in their connection strings) + headroom for operators.
          args: [-c, max_connections=150]
          ports: [{ containerPort: 5432, name: postgres }]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: ledgerline-secrets, key: postgres-password } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          readinessProbe:
            exec: { command: [pg_isready, -U, postgres] }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
            - { name: run, mountPath: /var/run/postgresql }
      volumes:
        - name: init
          configMap: { name: postgres-init }
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: postgres }]
